<mat-card>
    <mat-card-content>
        <form (ngSubmit)="onSavePost(postForm)" #postForm="ngForm">
            <div class="row">
                <div class="col-md-12">
                    <mat-form-field>
                        <input type="text" matInput [ngModel]="post?.title" name="title" required minlength="3" #title="ngModel"> 
                        <mat-error *ngIf="title.invalid">Please enter valid value</mat-error>
                    </mat-form-field>
                </div>
                <div class="col-md-12">
                    <mat-form-field class="example-full-width">
                        <textarea matInput rows="6" [ngModel]="post?.content" name="content" required #content="ngModel"></textarea>
                        <mat-error *ngIf="content.invalid">Please enter valid value</mat-error> 
                    </mat-form-field>
                </div>
            </div>
            <hr>
            <button mat-raised-button color="primary" type="submit" >Save Post</button>
        </form>
    </mat-card-content>
</mat-card>
