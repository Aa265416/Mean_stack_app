<mat-card>
    <mat-spinner *ngIf="isLoading" class="center"></mat-spinner>
    <mat-card-content>
        <form [formGroup]="form" (ngSubmit)="onSavePost()" *ngIf="!isLoading">
            <div class="row">
                <div class="col-md-12">
                    <mat-form-field class="w-100">
                        <input type="text" matInput  name="title" formControlName="title">
                        <mat-error *ngIf="form.get('title')?.invalid">Please enter valid value</mat-error>
                    </mat-form-field>
                </div>
                <div class="col-md-12 mb-3">
                    <div>
                        <button mat-stroked-button type="button" (click)="filePicker.click()">Pick Img</button>
                        <input type="file" #filePicker (change)="onImagePicked($event)">
                    </div>
                </div>
                <div class="col-md-12">
                    <mat-form-field class="w-100">
                        <textarea matInput rows="6"  name="content" formControlName="content"></textarea>
                        <mat-error *ngIf="form.get('content')?.invalid">Please enter valid value</mat-error>
                    </mat-form-field>
                </div>
            </div>
            <hr>
            <button mat-raised-button color="primary" type="submit">Save Post</button>
        </form>
    </mat-card-content>
</mat-card>
